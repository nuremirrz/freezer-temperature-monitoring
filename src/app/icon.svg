<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Qimby">
  <!-- App palette: primary navy ground, page tone for the letter -->
  <rect width="64" height="64" rx="15" fill="#0e1b33"/>
  <g fill="none" stroke="#f5f7fa" stroke-width="6.5" stroke-linecap="round">
    <circle cx="32" cy="32" r="13"/>
